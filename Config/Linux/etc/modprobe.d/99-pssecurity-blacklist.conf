# PSSecurity kernel module blacklist. Deployed by Deploy-LinuxConfiguration.
# "install <module> /bin/true" makes every load of the module, including an explicit
# modprobe, do nothing. "blacklist" alone only stops automatic loading by alias.

# Unused filesystems, CIS 1.1.1.1 through 1.1.1.7

# Disable the compressed ROM filesystem from embedded devices.
install cramfs /bin/true
# Disable the Veritas VxFS driver.
install freevxfs /bin/true
# Disable the flash filesystem for embedded devices.
install jffs2 /bin/true
# Disable the Hierarchical File System driver.
install hfs /bin/true
# Disable the Mac HFS+ filesystem driver.
install hfsplus /bin/true
# Disable the compressed read-only filesystem used by live media.
install squashfs /bin/true
# Disable the filesystem used by DVD media.
install udf /bin/true

# Removable media and uncommon network protocols, CIS 1.1.23 and 3.4.1 through 3.4.4

# Block USB mass storage devices at the module level.
install usb-storage /bin/true
# Disable the Datagram Congestion Control Protocol.
install dccp /bin/true
# Disable the Stream Control Transmission Protocol.
install sctp /bin/true
# Disable the Reliable Datagram Sockets protocol.
install rds /bin/true
# Disable the Transparent Inter-Process Communication protocol.
install tipc /bin/true
