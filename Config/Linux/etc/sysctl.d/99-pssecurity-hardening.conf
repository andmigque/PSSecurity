# PSSecurity kernel hardening. Deployed by Deploy-LinuxConfiguration.
# The 99- prefix sorts last, so these values win over distribution defaults.

# Enable strict reverse path filtering to drop spoofed packets.
net.ipv4.conf.all.rp_filter = 1
# Apply reverse path filtering to interfaces created later.
net.ipv4.conf.default.rp_filter = 1
# Disable packet forwarding between interfaces.
net.ipv4.ip_forward = 0
# Enable SYN cookies to survive SYN flood attacks.
net.ipv4.tcp_syncookies = 1
# Enable full address space layout randomization.
kernel.randomize_va_space = 2
# Hide kernel pointers from unprivileged memory reads.
kernel.kptr_restrict = 2
# Restrict the kernel ring buffer to privileged users.
kernel.dmesg_restrict = 1

# Process hardening

# Forbid core dumps from SUID processes (CIS 1.5.1).
fs.suid_dumpable = 0
# Disable magic SysRq kernel commands.
kernel.sysrq = 0
# Limit ptrace to descendant processes.
kernel.yama.ptrace_scope = 1
# Deny BPF to unprivileged users until reboot.
kernel.unprivileged_bpf_disabled = 2
# Harden the BPF JIT for all users.
net.core.bpf_jit_harden = 2
# Prevent hard links to files the caller does not own.
fs.protected_hardlinks = 1
# Restrict symlink follows in sticky world-writable directories.
fs.protected_symlinks = 1
# Guard FIFO creation in shared directories.
fs.protected_fifos = 2
# Guard regular-file creation in shared directories.
fs.protected_regular = 2

# Network hardening

# Drop packets that name their own route.
net.ipv4.conf.all.accept_source_route = 0
# Apply source route rejection to interfaces created later.
net.ipv4.conf.default.accept_source_route = 0
# Ignore ICMP redirects that can rewrite routes.
net.ipv4.conf.all.accept_redirects = 0
# Apply redirect rejection to interfaces created later.
net.ipv4.conf.default.accept_redirects = 0
# Ignore redirects even toward known gateways.
net.ipv4.conf.all.secure_redirects = 0
# Apply secure redirect rejection to interfaces created later.
net.ipv4.conf.default.secure_redirects = 0
# Do not send ICMP redirects.
net.ipv4.conf.all.send_redirects = 0
# Apply send redirect silence to interfaces created later.
net.ipv4.conf.default.send_redirects = 0
# Log packets with impossible source addresses.
net.ipv4.conf.all.log_martians = 1
# Apply martian logging to interfaces created later.
net.ipv4.conf.default.log_martians = 1
# Ignore broadcast pings to blunt smurf attacks.
net.ipv4.icmp_echo_ignore_broadcasts = 1
# Ignore invalid ICMP error replies.
net.ipv4.icmp_ignore_bogus_error_responses = 1
# Ignore IPv6 ICMP redirects.
net.ipv6.conf.all.accept_redirects = 0
# Apply IPv6 redirect rejection to interfaces created later.
net.ipv6.conf.default.accept_redirects = 0
