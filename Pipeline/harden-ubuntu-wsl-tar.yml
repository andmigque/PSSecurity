trigger: none

variables:
- group: wsl-ubuntu-tar-group

pool:
  name: Default
  demands:
  - Agent.Name -equals DESKTOP-MHDOKOL

steps:
- checkout: self

- task: PowerShell@2
  displayName: Install Ubuntu
  env:
    WSL_USER: $(wslUser)
    WSL_SUDOER: $(wslSudoer)
  inputs:
    targetType: inline
    script: |
      if (-not $env:WSL_USER -or $env:WSL_USER -eq ('$' + '(wslUser)')) {
          throw 'Define wslUser in the pipeline variables or a referenced variable group.'
      }
      if (-not $env:WSL_SUDOER -or $env:WSL_SUDOER -eq ('$' + '(wslSudoer)')) {
          throw 'wslSudoer is missing from the referenced Key Vault variable group.'
      }
      if (-not (Test-Path -LiteralPath '$(Build.SourcesDirectory)\PSSecurity.psd1')) {
          throw 'PSSecurity module not found in the checked-out sources.'
      }

      $distro = "Ubuntu-$(Build.BuildId)-$(System.JobAttempt)"

      wsl.exe --install -d Ubuntu --name $distro --web-download --no-launch
      if ($LASTEXITCODE -ne 0) { throw 'Ubuntu installation failed.' }

      wsl.exe -d $distro -u root -- apt-get update
      if ($LASTEXITCODE -ne 0) { throw 'Package index update failed.' }

      # wget is added for Install-DpkgPwsh, which fetches the PowerShell .deb.
      wsl.exe -d $distro -u root -- env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git curl ca-certificates wget
      if ($LASTEXITCODE -ne 0) { throw 'Package installation failed.' }

      wsl.exe -d $distro -u root -- apt-get clean
      if ($LASTEXITCODE -ne 0) { throw 'Package cache cleanup failed.' }

      wsl.exe -d $distro -u root -- useradd --create-home --shell /bin/bash -- $env:WSL_USER
      if ($LASTEXITCODE -ne 0) { throw 'WSL user creation failed.' }

      wsl.exe -d $distro -u root -- useradd --create-home --shell /bin/bash --gid admin --groups sudo admin
      if ($LASTEXITCODE -ne 0) { throw 'Admin user creation failed.' }

      $OutputEncoding = [Text.UTF8Encoding]::new($false)
      wsl -d $distro -u root bash -c "echo 'admin:$($env:WSL_SUDOER)' | chpasswd"

      if ($LASTEXITCODE -ne 0) { throw 'Setting the admin password failed.' }

      wsl.exe -d $distro -u root -- sh -c "printf '\n[user]\ndefault=$env:WSL_USER\n' >> /etc/wsl.conf"
      if ($LASTEXITCODE -ne 0) { throw 'Setting the default WSL user failed.' }

- task: PowerShell@2
  displayName: Install PowerShell inside the distribution
  inputs:
    targetType: inline
    script: |
      $distro = "Ubuntu-$(Build.BuildId)-$(System.JobAttempt)"
      $debName = 'powershell_7.6.6-1.deb_amd64.deb'

      # Mirrors Public/Install-DpkgPwsh.ps1: fetch the pinned release, install it with
      # dpkg, then let apt resolve the dependencies the package needs. dpkg -i is
      # expected to report unmet dependencies, which the apt runs that follow repair,
      # so only the apt results and the final version check gate the step. -q keeps the
      # wget progress meter out of the build log.
      wsl.exe -d $distro -u root -- wget -q -O "/tmp/$debName" https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/$debName
      if ($LASTEXITCODE -ne 0) { throw 'PowerShell download failed.' }

      wsl.exe -d $distro -u root -- dpkg -i "/tmp/$debName"

      wsl.exe -d $distro -u root -- env DEBIAN_FRONTEND=noninteractive apt-get install -f -y
      if ($LASTEXITCODE -ne 0) { throw 'PowerShell dependency resolution failed.' }

      wsl.exe -d $distro -u root -- env DEBIAN_FRONTEND=noninteractive apt-get install -y powershell
      if ($LASTEXITCODE -ne 0) { throw 'PowerShell installation failed.' }

      wsl.exe -d $distro -u root -- rm -f "/tmp/$debName"

      wsl.exe -d $distro -u root -- pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      if ($LASTEXITCODE -ne 0) { throw 'PowerShell is not runnable.' }

- task: PowerShell@2
  displayName: Harden the distribution
  inputs:
    targetType: inline
    script: |
      $distro = "Ubuntu-$(Build.BuildId)-$(System.JobAttempt)"

      # Runs the module's Linux hardening functions inside the distribution as root, so
      # the exported image already carries them and no sudo password is needed. -Persist
      # writes the sysctl table to /etc/sysctl.d because runtime values do not survive
      # the export. Stopping on the first error keeps a partially hardened image from
      # ever being exported; unknown kernel keys stay non-fatal as Missing.
      wsl.exe -d $distro -u root --cd "$(Build.SourcesDirectory)" -- pwsh -NoLogo -NoProfile -Command "`$ErrorActionPreference = 'Stop'; Import-Module ./PSSecurity.psd1; Set-CronPermission; Set-SysctlHardening -Persist; Set-HomeDirectoryPermission"
      if ($LASTEXITCODE -ne 0) { throw 'Hardening failed.' }

- task: PowerShell@2
  displayName: Export Ubuntu TAR
  inputs:
    targetType: inline
    script: |
      $distro = "Ubuntu-$(Build.BuildId)-$(System.JobAttempt)"

      wsl.exe --export $distro "$(Build.ArtifactStagingDirectory)\ubuntu-hardened.tar"
      if ($LASTEXITCODE -ne 0) { throw 'Ubuntu export failed.' }

- task: PublishPipelineArtifact@1
  displayName: Publish Ubuntu TAR
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)\ubuntu-hardened.tar'
    artifact: ubuntu-wsl-hardened
